<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Types of home care illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22315e"/>
      <stop offset="1" stop-color="#101a3a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <circle cx="920" cy="250" r="170" fill="none" stroke="#c9a84c" stroke-width="3" opacity="0.5"/>
  <circle cx="920" cy="250" r="230" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.28"/>

  <!-- caregiver figure -->
  <circle cx="855" cy="185" r="30" fill="none" stroke="#f5efdf" stroke-width="9"/>
  <path d="M810 330 v-40 a45 45 0 0 1 90 0 v40" fill="none" stroke="#f5efdf" stroke-width="9" stroke-linecap="round"/>
  <!-- senior figure with cane -->
  <circle cx="985" cy="195" r="26" fill="none" stroke="#c9a84c" stroke-width="8"/>
  <path d="M948 330 v-36 a40 40 0 0 1 80 0 v36" fill="none" stroke="#c9a84c" stroke-width="8" stroke-linecap="round"/>
  <path d="M1042 262 v68" stroke="#c9a84c" stroke-width="7" stroke-linecap="round"/>
  <path d="M1042 262 q0 -12 12 -12" stroke="#c9a84c" stroke-width="7" fill="none" stroke-linecap="round"/>
  <!-- joined hands: small heart between them -->
  <path d="M920 258 l-15 -15 a10.5 10.5 0 0 1 15 -14 a10.5 10.5 0 0 1 15 14 z" fill="#f5efdf"/>
  <!-- roofline sheltering both -->
  <path d="M790 150 l130 -60 l130 60" fill="none" stroke="#f5efdf" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>

  <g opacity="0.35" stroke="#f5efdf" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M120 360 h180"/>
    <path d="M120 320 h120"/>
    <path d="M120 400 h240"/>
  </g>
</svg>
