<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-label="Home care illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22315e"/>
      <stop offset="1" stop-color="#101a3a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#bg)"/>
  <circle cx="920" cy="250" r="170" fill="none" stroke="#c9a84c" stroke-width="3" opacity="0.5"/>
  <circle cx="920" cy="250" r="230" fill="none" stroke="#c9a84c" stroke-width="2" opacity="0.28"/>

  <!-- house -->
  <g fill="none" stroke="#f5efdf" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M830 250 v110 h180 v-110"/>
    <path d="M810 260 l110 -95 l110 95"/>
  </g>
  <!-- heart inside -->
  <path d="M920 330 l-38 -38 a26 26 0 0 1 38 -36 a26 26 0 0 1 38 36 z" fill="#c9a84c"/>
  <!-- chimney -->
  <path d="M985 205 v-35 h24 v56" fill="none" stroke="#f5efdf" stroke-width="10" stroke-linecap="round"/>

  <g opacity="0.35" stroke="#f5efdf" stroke-width="3" fill="none" stroke-linecap="round">
    <path d="M120 360 h180"/>
    <path d="M120 320 h120"/>
    <path d="M120 400 h240"/>
  </g>
</svg>
